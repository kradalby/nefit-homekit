name: CI

on:
  push:
    branches: [main, initial-work]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@889f3180bb5f064ee9e3201428d04ae9e41d54ad # v31

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3

      - name: Run unit tests with coverage
        run: nix develop --command go test -v -cover -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: nix develop --command go tool cover -func=coverage.out | tail -n 20

      - name: Run race detector
        run: nix develop --command go test -race ./...

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@889f3180bb5f064ee9e3201428d04ae9e41d54ad # v31

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3

      - name: Run golangci-lint
        run: nix develop --command golangci-lint run ./...

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@889f3180bb5f064ee9e3201428d04ae9e41d54ad # v31

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3

      - name: Build binary with Nix
        run: nix build -L .#nefit-homekit

      - name: Show build info
        run: |
          file ./result/bin/nefit-homekit
          ls -lh ./result/bin/nefit-homekit
          ./result/bin/nefit-homekit --help >/dev/null 2>&1 || true

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nefit-homekit-linux
          path: result/bin/nefit-homekit
          retention-days: 7

  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@889f3180bb5f064ee9e3201428d04ae9e41d54ad # v31

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3

      - name: Run nix flake check
        run: nix flake check --all-systems
        timeout-minutes: 45

  nixos-tests:
    name: NixOS Tests (${{ matrix.check }})
    runs-on: ubuntu-latest
    needs: flake-check
    strategy:
      matrix:
        check: [module-test, integration-test]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@889f3180bb5f064ee9e3201428d04ae9e41d54ad # v31

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ${{ matrix.check }}
        run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}
        timeout-minutes: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Dumping logs ==="
          find . -name "*.log" -type f -exec echo "--- {} ---" \; -exec cat {} \; || true
