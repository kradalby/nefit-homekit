name: CI

on:
  push:
    branches: [main, initial-work]
  pull_request:
    branches: [main]
  # The NixOS VM tests need a live Bosch backend + real HAP pin, so they only
  # run on manual dispatch (see the nixos-tests job's if-guard).
  workflow_dispatch:

# Every `run:` step executes inside `nix develop`, so tools come straight from
# the flake devShell with no per-step prefix.
defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main

      - uses: Mic92/hestia/action@ff07bb902a9968ac0c3d0e51d90a606662a375d8 # main

      - name: Run unit tests with coverage
        run: go test -v -cover -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 20

      - name: Run race detector
        run: go test -race ./...

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main

      - uses: Mic92/hestia/action@ff07bb902a9968ac0c3d0e51d90a606662a375d8 # main

      - name: Run golangci-lint
        run: golangci-lint run ./...

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main

      - uses: Mic92/hestia/action@ff07bb902a9968ac0c3d0e51d90a606662a375d8 # main

      - name: Build binary with Nix
        run: nix build -L .#nefit-homekit

      - name: Show build info
        run: |
          file ./result/bin/nefit-homekit
          ls -lh ./result/bin/nefit-homekit
          ./result/bin/nefit-homekit --help >/dev/null 2>&1 || true

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nefit-homekit-linux
          path: result/bin/nefit-homekit
          retention-days: 7

  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main

      - uses: Mic92/hestia/action@ff07bb902a9968ac0c3d0e51d90a606662a375d8 # main

      - name: Run nix flake check
        # --no-build: evaluate the flake (catches eval/structure errors) without
        # realising the NixOS VM integration tests, which boot a VM and require a
        # live Bosch/Tailscale backend that isn't reachable in sandboxed CI. Those
        # checks remain in the flake for local runs (`nix flake check`).
        run: nix flake check --all-systems --no-build
        timeout-minutes: 45

  nixos-tests:
    name: NixOS Tests (${{ matrix.check }})
    # Boots a VM running the service, which needs a live Bosch backend and a
    # valid (non-insecure) HAP pin; not reachable in sandboxed push/PR CI.
    # Run on demand with `gh workflow run CI` once those are available.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: flake-check
    strategy:
      matrix:
        check: [module-test, integration-test]
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main

      - uses: Mic92/hestia/action@ff07bb902a9968ac0c3d0e51d90a606662a375d8 # main

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ${{ matrix.check }}
        run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}
        timeout-minutes: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Dumping logs ==="
          find . -name "*.log" -type f -exec echo "--- {} ---" \; -exec cat {} \; || true
