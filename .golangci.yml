# golangci-lint configuration v2
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
    - gocritic
    - revive
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - errname
    - errorlint
    - gochecknoinits
    - goconst
    - godot
    - gocyclo
    - goprintffuncname
    - nilnil
    - nolintlint
    - predeclared
    - whitespace

  settings:
    govet:
      disable:
        - shadow

    errcheck:
      check-type-assertions: true
      check-blank: true

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        # Events flow through tailscale.com/util/eventbus, whose generic
        # Publish/Subscribe API is value-typed by design. Passing events by
        # pointer to satisfy hugeParam would force pointer event types across
        # every publisher and subscriber and break that contract.
        - hugeParam

    gosec:
      excludes:
        - G104

    gocyclo:
      min-complexity: 15

    misspell:
      locale: US

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - gochecknoinits

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
